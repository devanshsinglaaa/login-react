services:
  mysql:
    image: mysql:8.4

    container_name: production_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: outstaff_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/outstaff_db.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - production_network

  backend:
    image: devopsdevansh/login-react-backend:latest

    container_name: production_backend

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: outstaff_db
      CLIENT_URL: http://3.89.255.32:3007

    ports:
      - "5000:5000"

    networks:
      - production_network

  frontend:
    image: devopsdevansh/login-react-frontend:latest

    container_name: production_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3007:80"

    networks:
      - production_network

volumes:
  mysql_data:

networks:
  production_network:
